plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mitufanhang.wear'
    compileSdk 36
    compileSdkMinor 1
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.mitufanhang.wear'
        minSdk 25
        targetSdk 30
        versionCode 3
        versionName '1.2.0'
    }

    def releasePropsFile = rootProject.file('keystore.properties')
    def releaseProps = new Properties()
    if (releasePropsFile.exists()) {
        releasePropsFile.withInputStream { releaseProps.load(it) }
    }
    def hasReleaseKey = releasePropsFile.exists() && releaseProps.getProperty('storeFile')

    signingConfigs {
        debug {
            def debugStore = file('../keystore/debug.keystore')
            if (debugStore.exists()) {
                storeFile debugStore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(releaseProps.getProperty('storeFile'))
                storePassword releaseProps.getProperty('storePassword')
                keyAlias releaseProps.getProperty('keyAlias')
                keyPassword releaseProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (file('../keystore/debug.keystore').exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
