name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 目标设备/系统
      placeholder: "例如 TicWatch Pro 3 / Wear OS 2.38"
